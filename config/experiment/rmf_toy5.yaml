# @package _global_

defaults:
  - override /data: toy5
  - override /time_sampler: uniform_interval
  - override /model: mlp
  - override /optim: adamw
  - _self_

data:
  train:
    transform_to_sphere: true

trainer:
  _target_: src.experiments.MeanFlowTrainer

manifold:
  _target_: src.manifold.ProductManifold
  manifold:
    _target_: src.manifold.Sphere

x_shape: [5, 3]

model:
  x_dim: 15

seed: 42

loss_p: 0.0

batch_size: 300
num_epochs: 100

eval:
  num_samples: 10000

eval_interval: 1
save_interval: 500
